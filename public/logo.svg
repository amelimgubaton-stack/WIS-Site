<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="35%" stop-color="#7E22CE"/>
      <stop offset="70%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1035"/>
    </linearGradient>

    <!-- Swoosh Arc Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="40%" stop-color="#EC4899"/>
      <stop offset="80%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>

    <!-- Ribbon Front Gradient -->
    <linearGradient id="wFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Ribbon Fold Shadow Gradient -->
    <linearGradient id="wFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Top Curved Arc / Swoosh -->
  <path d="M 68 315 C 65 200, 150 112, 368 120 C 275 102, 115 138, 88 275 C 78 300, 70 312, 68 315 Z" fill="url(#swooshGrad)"/>

  <!-- The "W" Ribbon Structure -->
  <g filter="url(#shadow)">
    <!-- Back Fold Shader Layer for 3D Overlap -->
    <path d="M 270 300 L 335 390 C 350 410, 375 405, 385 385 L 435 185 C 440 165, 415 155, 398 175 L 360 270 L 310 200 C 295 180, 265 185, 255 205 L 210 330 L 175 240 C 165 215, 135 220, 130 245 L 160 380 C 170 410, 198 412, 212 385 Z" fill="url(#wFold)" opacity="0.6"/>

    <!-- Main White W Ribbon -->
    <path d="M 132 242 
             C 125 215, 155 195, 178 215 
             L 218 310 
             L 268 198 
             C 278 175, 310 175, 320 198 
             L 368 285 
             L 402 180 
             C 410 155, 442 165, 436 192 
             L 380 388 
             C 368 420, 335 420, 320 392 
             L 268 285 
             L 215 392 
             C 200 420, 168 418, 156 388 
             Z" fill="url(#wFront)"/>

    <!-- Highlight Overlap Accent -->
    <path d="M 268 198 C 278 175, 310 175, 320 198 L 368 285 L 350 325 L 305 242 Z" fill="url(#wFold)" opacity="0.3"/>
  </g>
</svg>
